<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аэрогриль · Рецепты по настроению</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --accent-color: var(--tg-theme-button-color, #f97316);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --card-border: rgba(148, 163, 184, 0.16);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        .surface-card {
            background-color: var(--secondary-bg);
            border: 1px solid var(--card-border);
        }

        .text-hint {
            color: var(--hint-color);
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        /* Горизонтальный скролл ленты меню без полосы прокрутки */
        .horizontal-scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .horizontal-scroll.grabbing {
            cursor: grabbing;
        }

        .chip-item {
            flex: 0 0 auto;
            white-space: nowrap;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .chip-item:active {
            transform: scale(0.96);
        }

        @keyframes slideUp {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-animate {
            animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .shake-alert-pulse {
            animation: pulseGlow 1.4s infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-opacity-90 border-b border-slate-700/30 px-4 pt-3 pb-3" style="background-color: var(--bg-color);">

                        🔥
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base font-bold leading-tight truncate">Аэрогриль Шеф</h1>

                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <!-- Кнопка-рулетка "Выбери за меня" -->
                    <button id="random-btn" type="button" onclick="pickRandomRecipe()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition" title="Случайный рецепт">
                        <span>🎲</span>
                        <span class="hidden sm:inline">Удиви</span>
                    </button>

                    <!-- Кнопка Избранного -->
                    <button id="fav-filter-btn" type="button" onclick="toggleFavoritesView()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                        <span id="fav-heart-icon">🤍</span>
                        <span id="fav-count" class="font-bold">0</span>
                    </button>
                </div>
            </div>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА ПОИСКА -->
            <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl surface-card mb-2.5">
                <button id="mode-name-btn" type="button" onclick="setSearchMode('name')" class="py-1.5 px-3 rounded-lg text-xs font-semibold transition btn-accent">
                    🔍 По блюду / слову
                </button>
                <button id="mode-fridge-btn" type="button" onclick="setSearchMode('fridge')" class="py-1.5 px-3 rounded-lg text-xs font-semibold transition text-hint">
                    🧊 Из холодильника
                </button>
            </div>

            <!-- ПОЛЕ ПОИСКА -->
            <div class="relative">
                <input
                    id="search-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Поиск по 550+ рецептам: шарлотка, запеканка, шашлык..."
                    oninput="handleSearchInput(this.value)"
                    class="w-full surface-card rounded-xl pl-3.5 pr-10 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/70 transition"
                    style="color: var(--text-color);"
                >
                <button
                    id="clear-search-btn"
                    type="button"
                    onclick="clearSearch()"
                    class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-500/20 text-xs flex items-center justify-center text-hint hover:text-white"
                >
                    ✕
                </button>
            </div>

            <!-- БЫСТРЫЕ ПРОДУКТЫ (ПОКАЗЫВАЮТСЯ В РЕЖИМЕ ХОЛОДИЛЬНИКА) -->
            <div id="fridge-chips-wrapper" class="hidden mt-2.5">
                <div id="fridge-chips" class="horizontal-scroll gap-1.5 pb-0.5"></div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-xl mx-auto px-4 pt-3">
        <!-- ГОРИЗОНТАЛЬНОЕ СКРОЛЛ-МЕНЮ НАСТРОЕНИЙ -->
        <section id="mood-section" class="mb-4">
            <div id="mood-chips" class="horizontal-scroll gap-2 py-1"></div>
        </section>

        <!-- СЧЁТЧИК РЕЗУЛЬТАТОВ И СБРОС -->
        <div class="flex items-center justify-between mb-3">
            <p id="results-label" class="text-xs font-medium text-hint">Загружаем рецепты...</p>
            <button id="reset-filters-btn" type="button" onclick="resetAllFilters()" class="hidden text-xs font-semibold text-orange-400">
                Сбросить фильтры
            </button>
        </div>

        <!-- СЕТКА КАРТОЧЕК РЕЦЕПТОВ -->
        <div id="recipes-grid" class="grid grid-cols-1 gap-3"></div>

        <!-- КНОПКА ПОДГРУЗКИ ЕЩЁ РЕЦЕПТОВ -->
        <div id="load-more-wrapper" class="hidden mt-4 text-center">
            <button
                id="load-more-btn"
                type="button"
                onclick="loadMoreRecipes()"
                class="w-full surface-card py-3 px-4 rounded-2xl text-xs font-bold text-orange-400 active:scale-[0.99] transition"
            >
                Показать ещё рецепты
            </button>
        </div>

        <!-- ПУСТОЕ СОСТОЯНИЕ -->
        <div id="empty-state" class="hidden text-center py-12 px-4 surface-card rounded-2xl mt-2">
            <div class="text-4xl mb-2">🍳</div>
            <h3 class="text-base font-bold mb-1">Ничего не нашлось</h3>
            <p class="text-xs text-hint mb-4">Попробуй другое слово (например: «шарлотка», «картошка», «курица») или выбери случайный рецепт.</p>
            <button type="button" onclick="pickRandomRecipe()" class="btn-accent px-4 py-2.5 rounded-xl text-xs font-bold shadow">

            </button>

    </main>

    <!-- МОДАЛЬНОЕ ОКНО РЕЦЕПТА -->
    <div id="recipe-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" style="background-color: var(--bg-color);">
        <div class="max-w-xl mx-auto min-h-screen pb-28 modal-animate">
            <!-- Шапка модального окна -->
            <div class="sticky top-0 z-20 flex items-center justify-between px-4 py-3 border-b border-slate-700/30 backdrop-blur-md" style="background-color: var(--bg-color);">
                <button type="button" onclick="closeRecipeModal()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                    <span>←</span>
                    <span>Назад</span>
                </button>

                <div class="flex items-center gap-2">

                        <span>📤</span>
                        <span>Список в TG</span>
                    </button>

                        🤍
                    </button>
                </div>
            </div>

        </div>
    </div>

        // =========================================================================

        // =========================================================================
        const tg = window.Telegram?.WebApp;

        function haptic(type = 'light') {
            try {
                if (!tg?.HapticFeedback) return;
                if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(type)) {
                    tg.HapticFeedback.impactOccurred(type);
                } else if (['error', 'success', 'warning'].includes(type)) {
                    tg.HapticFeedback.notificationOccurred(type);
                } else {
                    tg.HapticFeedback.selectionChanged();
                }
            } catch (e) {}
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.remove('hidden');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2600);
        }

        function initTelegram() {
            try {
                if (!tg) return;
                tg.ready();
                tg.expand();

                const user = tg.initDataUnsafe?.user;
                if (user?.first_name) {
                    const greetingEl = document.getElementById('user-greeting');
                    if (greetingEl) {
                        greetingEl.textContent = `Привет, ${user.first_name}! Что приготовим?`;
                    }
                }

                if (tg.BackButton) {
                    tg.BackButton.onClick(() => {
                        if (!document.getElementById('recipe-modal').classList.contains('hidden')) {
                            closeRecipeModal();
                        }
                    });
                }
            } catch (e) {}

                    { title: 'в соусе терияки с кунжутом', ing: [{ name: 'Соус терияки', amount: 25, unit: 'мл' }, { name: 'Кунжут', amount: 1, unit: 'ч.л.' }] },
                    { title: 'со сметанно-чесночным соусом и зеленью', ing: [{ name: 'Сметана', amount: 60, unit: 'г', category: 'сметана' }, { name: 'Чеснок и укроп', amount: 10, unit: 'г', category: 'чеснок' }] },
                    { title: 'в сливочном масле с укропом', ing: [{ name: 'Сливочное масло растопленное', amount: 15, unit: 'г', category: 'масло' }, { name: 'Укроп', amount: 10, unit: 'г' }] },
                    { title: 'с сырным дип-соусом для компании', ing: [{ name: 'Сырный соус', amount: 50, unit: 'г' }, { name: 'Масло растительное', amount: 10, unit: 'мл', category: 'масло' }] }
                ],
                (b, s, idx) => ({
                    id: `gen-frozen-${idx}`,
                    title: `${b.name} ${s.title}`,
                    emoji: b.emoji,
                    moods: b.moods,
                    temp: b.temp,
                    time: b.time,
                    baseServings: 2,
                    calories: `${b.cal} ккал`,
                    keywords: ['полуфабрикаты', 'быстро', 'замороженные', 'пельмени', 'наггетсы', b.name.toLowerCase(), s.title.toLowerCase()],
                    ingredients: [
                        { name: b.name, amount: 350, unit: 'г' },
                        ...s.ing
                    ],
                    steps: [
                        'Не размораживай заранее! Сбрызни или обваляй в масле со специями прямо из морозилки.',
                        'Выложи в корзину в один слой, чтобы горячий воздух свободно циркулировал.',
                        `Готовь при ${b.temp}°C ${b.time} минут, один раз встряхнув корзину в середине.`
                    ]
                })
            );

            return generated;
        }

        RECIPES.push(...generateExtendedRecipes());

        // =========================================================================
        // 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        // =========================================================================
        const state = {
            searchMode: 'name',          // 'name' | 'fridge'
            searchQuery: '',
            selectedMood: 'all',
            onlyFavorites: false,
            visibleLimit: 30,
            favorites: JSON.parse(localStorage.getItem('airfryer_favs_v2') || '[]'),
            activeRecipeId: null,
            servings: 2,
            // Модификации ингредиентов для открытого рецепта: { [idx]: { status: 'normal'|'removed'|'replaced', replacement: string, note: string } }
            ingMods: {},
            openSubDrawerIdx: null,
            // Состояние таймера
            timerRemainingSec: 0,
            timerTotalSec: 0,
            timerRunning: false,
            shakeNotified: false,
            timerInterval: null
        };

        // =========================================================================
        // 4. АНАЛИТИКА (ОТПРАВКА В GOOGLE ТАБЛИЦУ)
        // =========================================================================
        function trackEvent(event, details = '') {
            if (!ANALYTICS_WEBHOOK_URL) return;
            try {
                const user = tg?.initDataUnsafe?.user || {};
                const payload = {
                    timestamp: new Date().toLocaleString('ru-RU'),
                    userId: user.id || 'browser',
                    fullName: [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Гость',
                    username: user.username ? `@${user.username}` : '—',
                    platform: tg?.platform || navigator.platform || 'web',
                    event,
                    details
                };

                fetch(ANALYTICS_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
            } catch (e) {}
        }

        // =========================================================================
        // 5. УМНЫЙ ПОИСК И НОРМАЛИЗАЦИЯ СЛОВ
        // =========================================================================
        function stemRu(word) {
            let w = word.toLowerCase().replace(/ё/g, 'е').trim();
            if (w.length <= 3) return w;
            // Обрезаем типичные падежные окончания для уверенного поиска ("шарлотку" -> "шарлотк", "запеканку" -> "запеканк")
            return w.replace(/(ами|ями|ого|его|ому|ему|ыми|ими|ах|ях|ов|ев|ей|ом|ем|ой|ий|ый|ая|яя|ое|ее|ые|ие|у|ю|а|я|о|е|ы|и)$/, '');
        }

        function setSearchMode(mode) {
            haptic('selection');
            state.searchMode = mode;
            state.visibleLimit = 30;

            const nameBtn = document.getElementById('mode-name-btn');
            const fridgeBtn = document.getElementById('mode-fridge-btn');
            const input = document.getElementById('search-input');
            const fridgeWrapper = document.getElementById('fridge-chips-wrapper');

            if (mode === 'name') {
                nameBtn.classList.add('btn-accent');
                nameBtn.classList.remove('text-hint');
                fridgeBtn.classList.remove('btn-accent');
                fridgeBtn.classList.add('text-hint');
                input.placeholder = 'Поиск по 550+ рецептам: шарлотка, запеканка, шашлык...';
                fridgeWrapper.classList.add('hidden');
            } else {
                fridgeBtn.classList.add('btn-accent');
                fridgeBtn.classList.remove('text-hint');
                nameBtn.classList.remove('btn-accent');
                nameBtn.classList.add('text-hint');
                input.placeholder = 'Введи продукты через запятую: курица, сыр, картошка...';
                fridgeWrapper.classList.remove('hidden');
                renderFridgeChips();
            }

            renderRecipesFeed();
        }

        function renderFridgeChips() {
            const container = document.getElementById('fridge-chips');
            if (!container) return;

            const activeTokens = state.searchQuery
                .toLowerCase()
                .split(/[,;\s]+/)
                .map(t => stemRu(t))
                .filter(Boolean);

            container.innerHTML = QUICK_FRIDGE_ITEMS.map(item => {
                const isSelected = activeTokens.includes(stemRu(item));
                return `
                    <button
                        type="button"
                        onclick="toggleFridgeQuickItem('${item}')"
                        class="chip-item px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                            isSelected
                                ? 'btn-accent border-transparent shadow-sm'
                                : 'surface-card text-hint hover:text-white'
                        }"
                    >
                        ${isSelected ? '✓ ' : '+ '}${item}
                    </button>
                `;
            }).join('');
        }

        function toggleFridgeQuickItem(item) {
            haptic('light');
            state.visibleLimit = 30;
            const input = document.getElementById('search-input');
            const parts = state.searchQuery
                .split(',')
                .map(s => s.trim())
                .filter(Boolean);

            const itemStem = stemRu(item);
            const existingIdx = parts.findIndex(p => stemRu(p) === itemStem);

            if (existingIdx >= 0) {
                parts.splice(existingIdx, 1);
            } else {
                parts.push(item.toLowerCase());
            }

            state.searchQuery = parts.join(', ');
            if (input) input.value = state.searchQuery;
            updateClearButtonVisibility();
            renderFridgeChips();
            renderRecipesFeed();
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
            state.visibleLimit = 30;
            updateClearButtonVisibility();
            if (state.searchMode === 'fridge') {
                renderFridgeChips();
            }
            renderRecipesFeed();
        }

        function clearSearch() {
            haptic('light');
            state.searchQuery = '';
            state.visibleLimit = 30;
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            updateClearButtonVisibility();
            if (state.searchMode === 'fridge') {
                renderFridgeChips();
            }
            renderRecipesFeed();
        }

        function updateClearButtonVisibility() {
            const btn = document.getElementById('clear-search-btn');
            if (!btn) return;
            if (state.searchQuery.trim().length > 0) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        function selectMood(moodId) {
            haptic('selection');
            state.onlyFavorites = false;
            state.selectedMood = moodId;
            state.visibleLimit = 30;
            updateFavoritesBadge();
            renderMoodChips();
            renderRecipesFeed();
        }

        function toggleFavoritesView() {
            haptic('light');
            state.onlyFavorites = !state.onlyFavorites;
            state.visibleLimit = 30;
            updateFavoritesBadge();
            renderMoodChips();
            renderRecipesFeed();
        }

        function resetAllFilters() {
            haptic('light');
            state.searchQuery = '';
            state.selectedMood = 'all';
            state.onlyFavorites = false;
            state.visibleLimit = 30;
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            updateClearButtonVisibility();
            updateFavoritesBadge();
            renderMoodChips();
            if (state.searchMode === 'fridge') renderFridgeChips();
            renderRecipesFeed();
        }

        function loadMoreRecipes() {
            haptic('light');
            state.visibleLimit += 30;
            renderRecipesFeed();
        }

        // =========================================================================
        // 6. РЕНДЕР МЕНЮ КАТЕГОРИЙ И ЛЕНТЫ РЕЦЕПТОВ
        // =========================================================================
        function renderMoodChips() {
            const container = document.getElementById('mood-chips');
            if (!container) return;

            container.innerHTML = MOOD_CATEGORIES.map(cat => {
                const isActive = !state.onlyFavorites && state.selectedMood === cat.id;
                return `
                    <button
                        type="button"
                        onclick="selectMood('${cat.id}')"
                        class="chip-item px-3.5 py-2 rounded-2xl text-xs font-semibold border transition ${
                            isActive
                                ? 'btn-accent border-transparent shadow-md'
                                : 'surface-card text-hint hover:text-white'
                        }"
                    >
                        ${cat.label}
                    </button>
                `;
            }).join('');
        }

        function updateFavoritesBadge() {
            const countEl = document.getElementById('fav-count');
            const heartEl = document.getElementById('fav-heart-icon');
            const btn = document.getElementById('fav-filter-btn');
            if (countEl) countEl.textContent = state.favorites.length;
            if (heartEl) heartEl.textContent = state.onlyFavorites ? '❤️' : '🤍';
            if (btn) {
                if (state.onlyFavorites) {
                    btn.classList.add('ring-2', 'ring-orange-500');
                } else {
                    btn.classList.remove('ring-2', 'ring-orange-500');
                }
            }
        }

        function renderRecipesFeed() {
            const grid = document.getElementById('recipes-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsLabel = document.getElementById('results-label');
            const resetBtn = document.getElementById('reset-filters-btn');
            const loadMoreWrapper = document.getElementById('load-more-wrapper');
            const loadMoreBtn = document.getElementById('load-more-btn');
            if (!grid) return;

            const q = state.searchQuery.trim().toLowerCase();
            let list = RECIPES.map(r => ({ recipe: r, matchedIngs: [] }));

            // Фильтр избранного
            if (state.onlyFavorites) {
                list = list.filter(item => state.favorites.includes(item.recipe.id));
            } else if (state.selectedMood !== 'all') {
                list = list.filter(item => item.recipe.moods.includes(state.selectedMood));
            }

            // Поиск по слову или по продуктам из холодильника
            if (q.length > 0) {
                if (state.searchMode === 'name') {
                    const tokens = q.split(/\s+/).map(stemRu).filter(Boolean);
                    list = list.filter(({ recipe }) => {
                        const haystack = [
                            recipe.title,
                            ...(recipe.keywords || []),
                            ...recipe.ingredients.map(i => i.name)
                        ].join(' ').toLowerCase().replace(/ё/g, 'е');

                        return tokens.every(tok => haystack.includes(tok));
                    });
                } else {
                    const fridgeTokens = q.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
                    const fridgeStems = fridgeTokens.map(stemRu).filter(Boolean);

                    list = list
                        .map(({ recipe }) => {
                            const matched = [];
                            recipe.ingredients.forEach(ing => {
                                const ingNorm = ing.name.toLowerCase().replace(/ё/g, 'е');
                                const isMatch = fridgeStems.some(st => st.length >= 2 && ingNorm.includes(st));
                                if (isMatch) matched.push(ing.name);
                            });
                            return { recipe, matchedIngs: matched };
                        })
                        .filter(item => item.matchedIngs.length > 0)
                        .sort((a, b) => b.matchedIngs.length - a.matchedIngs.length);
                }
            }

            const hasActiveFilters = q.length > 0 || state.selectedMood !== 'all' || state.onlyFavorites;
            if (resetBtn) {
                resetBtn.classList.toggle('hidden', !hasActiveFilters);
            }

            if (resultsLabel) {
                if (state.onlyFavorites) {
                    resultsLabel.textContent = `Избранные рецепты: ${list.length}`;
                } else if (q.length > 0) {
                    resultsLabel.textContent = `Найдено вариантов: ${list.length}`;
                } else {
                    resultsLabel.textContent = `Доступно рецептов: ${list.length}`;
                }
            }

            if (list.length === 0) {
                grid.innerHTML = '';
                if (loadMoreWrapper) loadMoreWrapper.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const visibleSlice = list.slice(0, state.visibleLimit);
            const remainingCount = list.length - visibleSlice.length;

            if (loadMoreWrapper && loadMoreBtn) {
                if (remainingCount > 0) {
                    loadMoreWrapper.classList.remove('hidden');
                    loadMoreBtn.textContent = `Показать ещё (+${Math.min(30, remainingCount)} из ${remainingCount})`;
                } else {
                    loadMoreWrapper.classList.add('hidden');
                }
            }

            grid.innerHTML = visibleSlice.map(({ recipe, matchedIngs }) => {
                const isFav = state.favorites.includes(recipe.id);
                const ingPreview = recipe.ingredients.slice(0, 4).map(i => i.name).join(' · ');

                const matchedBadge = matchedIngs.length > 0
                    ? `<div class="mt-2 inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-[11px] font-medium text-emerald-400">
                           ✓ Есть дома (${matchedIngs.length}): ${matchedIngs.slice(0, 3).join(', ')}
                       </div>`
                    : '';

                return `
                    <article
                        onclick="openRecipeModal('${recipe.id}')"
                        class="surface-card rounded-2xl p-3.5 active:scale-[0.99] transition cursor-pointer relative overflow-hidden"
                    >
                        <div class="flex items-start gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-slate-500/10 flex items-center justify-center text-2xl shrink-0">
                                ${recipe.emoji}
                            </div>

                            <div class="min-w-0 flex-1 pr-7">
                                <h3 class="text-sm font-bold leading-snug mb-1.5">${recipe.title}</h3>

                                <div class="flex flex-wrap items-center gap-1.5 text-[11px] font-semibold">
                                    <span class="px-2 py-0.5 rounded-lg bg-orange-500/15 text-orange-400">
                                        🌡 ${recipe.temp}°C
                                    </span>
                                    <span class="px-2 py-0.5 rounded-lg bg-sky-500/15 text-sky-400">
                                        ⏱ ${recipe.time} мин
                                    </span>
                                    <span class="px-2 py-0.5 rounded-lg bg-slate-500/15 text-hint">
                                        🔥 ${recipe.calories}
                                    </span>
                                </div>

                                <p class="text-[11px] text-hint truncate mt-2">${ingPreview}</p>
                                ${matchedBadge}
                            </div>

                            <button
                                type="button"
                                onclick="event.stopPropagation(); toggleFavoriteById('${recipe.id}')"
                                class="absolute top-3 right-3 w-8 h-8 rounded-xl bg-slate-500/10 flex items-center justify-center text-sm active:scale-90 transition"
                                aria-label="В избранное"
                            >
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function toggleFavoriteById(id) {
            haptic('light');
            const idx = state.favorites.indexOf(id);
            if (idx >= 0) {
                state.favorites.splice(idx, 1);
                showToast('Убрано из избранного');
            } else {
                state.favorites.push(id);
                showToast('Добавлено в избранное ❤️');
            }
            localStorage.setItem('airfryer_favs_v2', JSON.stringify(state.favorites));
            updateFavoritesBadge();
            renderRecipesFeed();

            if (state.activeRecipeId === id) {
                const modalFavBtn = document.getElementById('modal-fav-btn');
                if (modalFavBtn) {
                    modalFavBtn.textContent = state.favorites.includes(id) ? '❤️' : '🤍';
                }
            }
        }

        function pickRandomRecipe() {
            haptic('medium');
            const pool = state.selectedMood === 'all'
                ? RECIPES
                : RECIPES.filter(r => r.moods.includes(state.selectedMood));
            const source = pool.length > 0 ? pool : RECIPES;
            const random = source[Math.floor(Math.random() * source.length)];
            if (random) {
                openRecipeModal(random.id);
            }
        }

        // =========================================================================
        // 7. МОДАЛЬНОЕ ОКНО РЕЦЕПТА, КАЛЬКУЛЯТОР ПОРЦИЙ, ЗАМЕНА ИНГРЕДИЕНТОВ И ТАЙМЕР
        // =========================================================================
        function formatAmount(amount, factor) {
            const val = amount * factor;
            if (val >= 10) return Math.round(val);
            const rounded = Math.round(val * 10) / 10;
            return Number.isInteger(rounded) ? rounded : rounded.toString().replace('.', ',');
        }

        function openRecipeModal(id) {
            const recipe = RECIPES.find(r => r.id === id);
            if (!recipe) return;

            haptic('light');
            stopTimer(false);

            state.activeRecipeId = id;
            state.servings = recipe.baseServings || 2;
            state.ingMods = {};
            state.openSubDrawerIdx = null;
            state.timerTotalSec = recipe.time * 60;
            state.timerRemainingSec = recipe.time * 60;
            state.timerRunning = false;
            state.shakeNotified = false;

            const modal = document.getElementById('recipe-modal');
            const modalFavBtn = document.getElementById('modal-fav-btn');
            if (modalFavBtn) {
                modalFavBtn.textContent = state.favorites.includes(id) ? '❤️' : '🤍';
            }

            renderModalBody();
            modal.classList.remove('hidden');
            modal.scrollTop = 0;

            try {
                if (tg?.BackButton) tg.BackButton.show();
            } catch (e) {}

            trackEvent('view_recipe', recipe.title);
        }

        function closeRecipeModal() {
            haptic('light');
            stopTimer(false);
            state.activeRecipeId = null;
            document.getElementById('recipe-modal').classList.add('hidden');
            try {
                if (tg?.BackButton) tg.BackButton.hide();
            } catch (e) {}
        }

        function toggleModalFavorite() {
            if (!state.activeRecipeId) return;
            toggleFavoriteById(state.activeRecipeId);
        }

        function changeServings(delta) {
            const next = state.servings + delta;
            if (next < 1 || next > 8) return;
            haptic('selection');
            state.servings = next;
            renderModalBody();
        }

        function toggleSubDrawer(idx) {
            haptic('selection');
            state.openSubDrawerIdx = state.openSubDrawerIdx === idx ? null : idx;
            renderModalBody();
        }

        function applyIngredientReplacement(idx, replacementName, note = '') {
            const clean = replacementName.trim();
            if (!clean) return;
            haptic('success');
            state.ingMods[idx] = {
                status: 'replaced',
                replacement: clean,
                note
            };
            state.openSubDrawerIdx = null;
            renderModalBody();
            showToast(`Заменено на: ${clean}`);
        }

        function applyCustomReplacement(idx) {
            const input = document.getElementById(`custom-sub-input-${idx}`);
            if (!input || !input.value.trim()) {
                showToast('Впиши свой продукт для замены');
                return;
            }
            applyIngredientReplacement(idx, input.value.trim(), 'Своя замена из холодильника');
        }

        function toggleRemoveIngredient(idx) {
            haptic('light');
            const current = state.ingMods[idx];
            if (current?.status === 'removed') {
                delete state.ingMods[idx];
                showToast('Ингредиент возвращён');
            } else {
                state.ingMods[idx] = { status: 'removed' };
                if (state.openSubDrawerIdx === idx) state.openSubDrawerIdx = null;
                showToast('Ингредиент убран из рецепта');
            }
            renderModalBody();
        }

        function resetIngredientMod(idx) {
            haptic('light');
            delete state.ingMods[idx];
            state.openSubDrawerIdx = null;
            renderModalBody();
        }

        function getAirfryerModificationWarnings(recipe) {
            const warnings = [];
            recipe.ingredients.forEach((ing, idx) => {
                const mod = state.ingMods[idx];
                if (mod?.status === 'removed') {
                    if (ing.category === 'масло') {
                        warnings.push('Без масла корочка получится более сухой — используй пергамент, чтобы блюдо не прилипло к решётке.');
                    }
                    if (ing.category === 'яйцо') {
                        warnings.push('Без яиц масса может хуже держать форму — аккуратно переворачивай лопаткой.');
                    }
                }
            });
            return warnings;
        }

        function renderModalBody() {
            const recipe = RECIPES.find(r => r.id === state.activeRecipeId);
            const body = document.getElementById('modal-body');
            if (!recipe || !body) return;

            const factor = state.servings / (recipe.baseServings || 2);
            const warnings = getAirfryerModificationWarnings(recipe);
            const activeReplacements = [];

            const ingredientsHtml = recipe.ingredients.map((ing, idx) => {
                const mod = state.ingMods[idx] || { status: 'normal' };
                const scaledAmt = formatAmount(ing.amount, factor);
                const isDrawerOpen = state.openSubDrawerIdx === idx;
                const presets = (ing.category && INGREDIENT_SUBSTITUTES[ing.category]) || [];

                if (mod.status === 'replaced') {
                    activeReplacements.push({ original: ing.name, replacement: mod.replacement });
                }

                let rowClass = 'surface-card';
                let titleHtml = `<span class="font-semibold">${ing.name}</span>`;
                let badgeHtml = '';

                if (mod.status === 'removed') {
                    rowClass = 'surface-card opacity-60';
                    titleHtml = `<span class="line-through text-hint">${ing.name}</span>`;
                    badgeHtml = `<span class="ml-1.5 text-[10px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 font-semibold">Убрано</span>`;
                } else if (mod.status === 'replaced') {
                    rowClass = 'surface-card border-amber-500/40';
                    titleHtml = `
                        <span class="line-through text-hint text-xs">${ing.name}</span>
                        <div class="font-bold text-amber-400 text-xs mt-0.5">⇄ ${mod.replacement}</div>
                    `;
                }

                const drawerHtml = isDrawerOpen ? `
                    <div class="mt-2.5 pt-2.5 border-t border-slate-700/40 space-y-2">
                        <p class="text-[11px] font-semibold text-hint">Чем заменить «${ing.name}»:</p>
                        ${presets.length > 0 ? `
                            <div class="space-y-1.5">
                                ${presets.map(p => `
                                    <button
                                        type="button"
                                        onclick="applyIngredientReplacement(${idx}, '${p.name.replace(/'/g, "\\'")}', '${p.note.replace(/'/g, "\\'")}')"
                                        class="w-full text-left p-2 rounded-xl bg-slate-500/10 hover:bg-slate-500/20 transition"
                                    >
                                        <div class="text-xs font-bold text-amber-300">⇄ ${p.name}</div>
                                        <div class="text-[11px] text-hint">${p.note}</div>
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="flex gap-1.5 pt-1">
                            <input
                                id="custom-sub-input-${idx}"
                                type="text"
                                placeholder="Свой вариант из холодильника..."
                                class="flex-1 rounded-xl px-2.5 py-1.5 text-xs bg-slate-900/60 border border-slate-600/40 focus:outline-none"
                                style="color: var(--text-color);"
                            >
                            <button
                                type="button"
                                onclick="applyCustomReplacement(${idx})"
                                class="btn-accent px-3 py-1.5 rounded-xl text-xs font-bold shrink-0"
                            >
                                ОК
                            </button>
                        </div>
                    </div>
                ` : '';

                return `
                    <div class="${rowClass} rounded-xl p-2.5 transition">
                        <div class="flex items-center justify-between gap-2">
                            <div class="min-w-0 flex-1 text-xs">
                                ${titleHtml}${badgeHtml}
                            </div>

                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="text-xs font-bold px-2 py-1 rounded-lg bg-slate-500/10">
                                    ${scaledAmt} ${ing.unit}
                                </span>

                                ${mod.status !== 'normal' ? `
                                    <button
                                        type="button"
                                        onclick="resetIngredientMod(${idx})"
                                        class="px-2 py-1 rounded-lg bg-slate-500/15 text-[11px] font-semibold text-sky-400"
                                        title="Вернуть оригинал"
                                    >
                                        Вернуть
                                    </button>
                                ` : ''}

                                <button
                                    type="button"
                                    onclick="toggleSubDrawer(${idx})"
                                    class="w-7 h-7 rounded-lg bg-amber-500/15 text-amber-400 text-xs font-bold flex items-center justify-center active:scale-90 transition"
                                    title="Заменить ингредиент"
                                >
                                    ⇄
                                </button>

                                <button
                                    type="button"
                                    onclick="toggleRemoveIngredient(${idx})"
                                    class="w-7 h-7 rounded-lg ${mod.status === 'removed' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-rose-500/15 text-rose-400'} text-xs font-bold flex items-center justify-center active:scale-90 transition"
                                    title="${mod.status === 'removed' ? 'Вернуть' : 'Убрать'}"
                                >
                                    ${mod.status === 'removed' ? '↺' : '✕'}
                                </button>
                            </div>
                        </div>
                        ${drawerHtml}
                    </div>
                `;
            }).join('');

            const warningsHtml = warnings.length > 0 ? `
                <div class="p-3 rounded-2xl bg-amber-500/15 border border-amber-500/30 space-y-1">
                    <div class="text-xs font-bold text-amber-300">💡 Совет шефа по вашим правкам:</div>
                    ${warnings.map(w => `<p class="text-[11px] text-amber-100/90 leading-relaxed">• ${w}</p>`).join('')}
                </div>
            ` : '';

            const replacementsSummaryHtml = activeReplacements.length > 0 ? `
                <div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/25 text-[11px] text-amber-300">
                    <strong>Активные замены:</strong> ${activeReplacements.map(r => `${r.original} → <u>${r.replacement}</u>`).join('; ')}
                </div>
            ` : '';

            const stepsHtml = recipe.steps.map((step, i) => `
                <div class="flex items-start gap-3 surface-card rounded-2xl p-3">
                    <div class="w-6 h-6 rounded-full btn-accent text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">
                        ${i + 1}
                    </div>
                    <p class="text-xs leading-relaxed">${step}</p>
                </div>
            `).join('');

            body.innerHTML = `
                <!-- Заголовок и режимы аэрогриля -->
                <div class="surface-card rounded-2xl p-4">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-14 h-14 rounded-2xl bg-slate-500/10 flex items-center justify-center text-3xl shrink-0">
                            ${recipe.emoji}
                        </div>
                        <div>
                            <h2 class="text-base font-extrabold leading-snug">${recipe.title}</h2>
                            <p class="text-xs text-hint mt-0.5">${recipe.calories} на 100 г</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="p-2.5 rounded-xl bg-orange-500/15">
                            <div class="text-[10px] text-hint uppercase font-semibold">Температура</div>
                            <div class="text-sm font-extrabold text-orange-400 mt-0.5">${recipe.temp}°C</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-sky-500/15">
                            <div class="text-[10px] text-hint uppercase font-semibold">Время</div>
                            <div class="text-sm font-extrabold text-sky-400 mt-0.5">${recipe.time} мин</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-slate-500/10">
                            <div class="text-[10px] text-hint uppercase font-semibold">Порции</div>
                            <div class="flex items-center justify-center gap-2 mt-0.5">
                                <button type="button" onclick="changeServings(-1)" class="w-5 h-5 rounded bg-slate-500/20 text-xs font-bold">−</button>
                                <span class="text-sm font-extrabold">${state.servings}</span>
                                <button type="button" onclick="changeServings(1)" class="w-5 h-5 rounded bg-slate-500/20 text-xs font-bold">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Встроенный таймер с сигналом встряхивания корзины -->
                <div class="surface-card rounded-2xl p-4">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <div class="text-xs font-bold flex items-center gap-1.5">
                                <span>⏱ Таймер аэрогриля</span>
                                <span id="timer-halfway-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 shake-alert-pulse">
                                    Пора встряхнуть!
                                </span>
                            </div>
                            <div id="timer-display" class="text-2xl font-extrabold tracking-tight mt-0.5 font-mono">
                                ${formatTimer(state.timerRemainingSec)}
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button
                                id="timer-toggle-btn"
                                type="button"
                                onclick="toggleTimer()"
                                class="btn-accent px-4 py-2.5 rounded-xl text-xs font-bold shadow active:scale-95 transition"
                            >
                                ${state.timerRunning ? 'Пауза' : 'Старт'}
                            </button>
                            <button
                                type="button"
                                onclick="resetTimer()"
                                class="surface-card px-3 py-2.5 rounded-xl text-xs font-semibold active:scale-95 transition"
                            >
                                Сброс
                            </button>
                        </div>
                    </div>
                    <p class="text-[11px] text-hint mt-2">
                        На экваторе (${Math.ceil(recipe.time / 2)} мин) телефон подаст сигнал встряхнуть чашу.
                    </p>
                </div>

                ${warningsHtml}

                <!-- Ингредиенты с заменой и удалением -->
                <section class="space-y-2">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-bold">Ингредиенты</h3>
                        <span class="text-[11px] text-hint">⇄ заменить · ✕ убрать</span>
                    </div>
                    ${ingredientsHtml}
                </section>

                <!-- Пошаговое приготовление -->
                <section class="space-y-2">
                    <h3 class="text-sm font-bold">Как готовить</h3>
                    ${replacementsSummaryHtml}
                    ${stepsHtml}
                </section>
            `;
        }

        function formatTimer(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playBeepSound(times = 2) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                for (let i = 0; i < times; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = i === times - 1 ? 880 : 660;
                    gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.25);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.25 + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.25);
                    osc.stop(ctx.currentTime + i * 0.25 + 0.22);
                }
            } catch (e) {}
        }

        function toggleTimer() {
            if (state.timerRunning) {
                stopTimer(true);
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (state.timerRemainingSec <= 0) {
                state.timerRemainingSec = state.timerTotalSec;
                state.shakeNotified = false;
            }
            haptic('medium');
            state.timerRunning = true;
            updateTimerUI();

            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timerRemainingSec -= 1;

                // Сигнал на 50% времени: встряхнуть корзину
                const halfway = Math.floor(state.timerTotalSec / 2);
                if (!state.shakeNotified && state.timerRemainingSec <= halfway && state.timerRemainingSec > 0) {
                    state.shakeNotified = true;
                    haptic('warning');
                    playBeepSound(2);
                    showToast('🔄 Половина времени! Встряхни корзину аэрогриля');
                    const badge = document.getElementById('timer-halfway-badge');
                    if (badge) badge.classList.remove('hidden');
                }

                if (state.timerRemainingSec <= 0) {
                    state.timerRemainingSec = 0;
                    stopTimer(false);
                    haptic('success');
                    playBeepSound(3);
                    showToast('🔥 Готово! Приятного аппетита!');
                }

                updateTimerUI();
            }, 1000);
        }

        function stopTimer(withHaptic = true) {
            if (withHaptic) haptic('light');
            state.timerRunning = false;
            clearInterval(state.timerInterval);
            updateTimerUI();
        }

        function resetTimer() {
            haptic('light');
            stopTimer(false);
            state.timerRemainingSec = state.timerTotalSec;
            state.shakeNotified = false;
            const badge = document.getElementById('timer-halfway-badge');
            if (badge) badge.classList.add('hidden');
            updateTimerUI();
        }

        function updateTimerUI() {
            const display = document.getElementById('timer-display');
            const btn = document.getElementById('timer-toggle-btn');
            if (display) display.textContent = formatTimer(state.timerRemainingSec);
            if (btn) btn.textContent = state.timerRunning ? 'Пауза' : 'Старт';
        }

        function shareShoppingList() {
            const recipe = RECIPES.find(r => r.id === state.activeRecipeId);
            if (!recipe) return;

            haptic('medium');
            const factor = state.servings / (recipe.baseServings || 2);
            const lines = [];

            recipe.ingredients.forEach((ing, idx) => {
                const mod = state.ingMods[idx];
                if (mod?.status === 'removed') return;
                const name = mod?.status === 'replaced' ? `${mod.replacement} (вместо: ${ing.name})` : ing.name;
                lines.push(`• ${name} — ${formatAmount(ing.amount, factor)} ${ing.unit}`);
            });

            const text = `🔥 ${recipe.title} (${recipe.temp}°C · ${recipe.time} мин · ${state.servings} порц.)\n\nСписок продуктов:\n${lines.join('\n')}`;

            try {
                if (tg?.openTelegramLink) {
                    const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(text)}`;
                    tg.openTelegramLink(shareUrl);
                    return;
                }
            } catch (e) {}

            // Fallback копирование в буфер обмена
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Список продуктов скопирован 📋');
        }

        // =========================================================================
        // 8. ПЛАВНЫЙ ГОРИЗОНТАЛЬНЫЙ СКРОЛЛ КОЛЁСИКОМ И ПЕРЕТАСКИВАНИЕМ МЫШИ
        // =========================================================================
        function enableHorizontalScrollEnhancements() {
            document.querySelectorAll('.horizontal-scroll').forEach(el => {
                el.addEventListener('wheel', e => {
                    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                        e.preventDefault();
                        el.scrollLeft += e.deltaY;
                    }
                }, { passive: false });

                let isDown = false;
                let startX = 0;
                let scrollLeft = 0;

                el.addEventListener('mousedown', e => {
                    isDown = true;
                    el.classList.add('grabbing');
                    startX = e.pageX - el.offsetLeft;
                    scrollLeft = el.scrollLeft;
                });

                el.addEventListener('mouseleave', () => {
                    isDown = false;
                    el.classList.remove('grabbing');
                });

                el.addEventListener('mouseup', () => {
                    isDown = false;
                    el.classList.remove('grabbing');
                });

                el.addEventListener('mousemove', e => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - el.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    el.scrollLeft = scrollLeft - walk;
                });
            });
        }

        // =========================================================================
        // 9. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // =========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            initTelegram();
            updateFavoritesBadge();
            renderMoodChips();
            renderRecipesFeed();
            enableHorizontalScrollEnhancements();
            trackEvent('app_open', `Всего рецептов: ${RECIPES.length}`);
        });
    </script>
</body>
</html>
