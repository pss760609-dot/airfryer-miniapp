<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аэрогриль · Рецепты по настроению</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --accent-color: var(--tg-theme-button-color, #f97316);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --card-border: rgba(148, 163, 184, 0.16);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        .surface-card {
            background-color: var(--secondary-bg);
            border: 1px solid var(--card-border);
        }

        .text-hint {
            color: var(--hint-color);
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        /* Горизонтальный скролл ленты меню без полосы прокрутки */
        .horizontal-scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .horizontal-scroll.grabbing {
            cursor: grabbing;
        }

        .chip-item {
            flex: 0 0 auto;
            white-space: nowrap;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .chip-item:active {
            transform: scale(0.96);
        }

        /* Плавное появление модального окна */
        @keyframes slideUp {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-animate {
            animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .shake-alert-pulse {
            animation: pulseGlow 1.4s infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-opacity-90 border-b border-slate-700/30 px-4 pt-3 pb-3" style="background-color: var(--bg-color);">

                        🔥
                    </div>

                    <!-- Кнопка-рулетка "Выбери за меня" -->
                    <button id="random-btn" type="button" onclick="pickRandomRecipe()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition" title="Случайный рецепт">

                    </button>

                    <!-- Кнопка Избранного -->
                    <button id="fav-filter-btn" type="button" onclick="toggleFavoritesView()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                        <span id="fav-heart-icon">🤍</span>
                        <span id="fav-count" class="font-bold">0</span>
                    </button>
                </div>
            </div>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА ПОИСКА -->
            <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl surface-card mb-2.5">
                <button id="mode-name-btn" type="button" onclick="setSearchMode('name')" class="py-1.5 px-3 rounded-lg text-xs font-semibold transition btn-accent">
                    🔍 По блюду / слову
                </button>
                <button id="mode-fridge-btn" type="button" onclick="setSearchMode('fridge')" class="py-1.5 px-3 rounded-lg text-xs font-semibold transition text-hint">
                    🧊 Из холодильника
                </button>
            </div>

            <!-- ПОЛЕ ПОИСКА -->
            <div class="relative">
                <input
                    id="search-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Например: шарлотка, запеканка, крылышки..."
                    oninput="handleSearchInput(this.value)"
                    class="w-full surface-card rounded-xl pl-3.5 pr-10 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/70 transition"
                    style="color: var(--text-color);"
                >
                <button
                    id="clear-search-btn"
                    type="button"
                    onclick="clearSearch()"
                    class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-500/20 text-xs flex items-center justify-center text-hint hover:text-white"
                >
                    ✕
                </button>
            </div>

            <!-- БЫСТРЫЕ ПРОДУКТЫ (ПОКАЗЫВАЮТСЯ В РЕЖИМЕ ХОЛОДИЛЬНИКА) -->
            <div id="fridge-chips-wrapper" class="hidden mt-2.5">
                <div id="fridge-chips" class="horizontal-scroll gap-1.5 pb-0.5"></div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-xl mx-auto px-4 pt-3">
        <!-- ГОРИЗОНТАЛЬНОЕ СКРОЛЛ-МЕНЮ НАСТРОЕНИЙ -->
        <section id="mood-section" class="mb-4">
            <div id="mood-chips" class="horizontal-scroll gap-2 py-1"></div>
        </section>

        <!-- СЧЁТЧИК РЕЗУЛЬТАТОВ И СБРОС -->
        <div class="flex items-center justify-between mb-3">
            <p id="results-label" class="text-xs font-medium text-hint">Загружаем рецепты...</p>
            <button id="reset-filters-btn" type="button" onclick="resetAllFilters()" class="hidden text-xs font-semibold text-orange-400">
                Сбросить фильтры
            </button>
        </div>

        <!-- СЕТКА КАРТОЧЕК РЕЦЕПТОВ -->
        <div id="recipes-grid" class="grid grid-cols-1 gap-3"></div>

        <!-- ПУСТОЕ СОСТОЯНИЕ -->
        <div id="empty-state" class="hidden text-center py-12 px-4 surface-card rounded-2xl mt-2">
            <div class="text-4xl mb-2">🍳</div>
            <h3 class="text-base font-bold mb-1">Ничего не нашлось</h3>
            <p class="text-xs text-hint mb-4">Попробуй другое слово (например: «шарлотка», «картошка», «курица») или выбери случайный рецепт.</p>
            <button type="button" onclick="pickRandomRecipe()" class="btn-accent px-4 py-2.5 rounded-xl text-xs font-bold shadow">

            </button>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО РЕЦЕПТА -->
    <div id="recipe-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" style="background-color: var(--bg-color);">

                    <span>←</span>
                    <span>Назад</span>
                </button>

                <div class="flex items-center gap-2">
                    <button type="button" onclick="shareShoppingList()" class="surface-card px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
                        <span>📤</span>
                        <span>Список в TG</span>
                    </button>
                    <button id="modal-fav-btn" type="button" onclick="toggleModalFavorite()" class="surface-card w-9 h-9 rounded-xl flex items-center justify-center text-base active:scale-95 transition">

        // =========================================================================

        // =========================================================================
        const tg = window.Telegram?.WebApp;

        function haptic(type = 'light') {
            try {
                if (!tg?.HapticFeedback) return;
                if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(type)) {
                    tg.HapticFeedback.impactOccurred(type);
                } else if (['error', 'success', 'warning'].includes(type)) {
                    tg.HapticFeedback.notificationOccurred(type);
                } else {
                    tg.HapticFeedback.selectionChanged();
                }
            } catch (e) {}
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.remove('hidden');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 2600);
        }

        function initTelegram() {
            try {
                if (!tg) return;
                tg.ready();
                tg.expand();

                const user = tg.initDataUnsafe?.user;
                if (user?.first_name) {
                    const greetingEl = document.getElementById('user-greeting');
                    if (greetingEl) {
                        greetingEl.textContent = `Привет, ${user.first_name}! Что приготовим?`;
                    }
                }

                if (tg.BackButton) {
                    tg.BackButton.onClick(() => {
                        if (!document.getElementById('recipe-modal').classList.contains('hidden')) {
                            closeRecipeModal();
                        }
                    });
                }
            } catch (e) {}

        // =========================================================================
        // 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        // =========================================================================
        const state = {
            searchMode: 'name',          // 'name' | 'fridge'
            searchQuery: '',

            selectedRecipe: null,
            servings: 2,
            // Модификации ингредиентов для текущего открытого рецепта:
            // { [index]: { removed: boolean, replacement: string | null, openDrawer: boolean } }
            ingMods: {},
            // Состояние таймера
            timer: {

        // =========================================================================
        // 4. УМНЫЙ ПОИСК (ПАДЕЖИ РУССКОГО ЯЗЫКА + ПОИСК ПО ХОЛОДИЛЬНИКУ)
        // =========================================================================
        function stemRussianWord(word) {
            let w = word.toLowerCase().replace(/ё/g, 'е').trim();
            if (w.length <= 3) return w;
            // Отрезаем частые окончания существительных и прилагательных
            return w.replace(/(ами|ями|ого|его|ому|ему|ыми|ими|ою|ею|ой|ей|ий|ый|ая|яя|ое|ее|ые|ие|ов|ев|ом|ем|ах|ях|у|ю|а|я|о|е|ы|и|ь)$/, '');
        }

        function matchesTextQuery(recipe, rawQuery) {
            const tokens = rawQuery
                .toLowerCase()
                .split(/[\s,.;!?]+/)
                .map(t => t.trim())
                .filter(Boolean);

            if (!tokens.length) return true;

            const searchableCorpus = [
                recipe.title,
                ...(recipe.keywords || []),
                ...recipe.ingredients.map(i => i.name)
            ].join(' ').toLowerCase().replace(/ё/g, 'е');

            const corpusWords = searchableCorpus.split(/[\s,.;:()\-–—]+/).filter(Boolean);
            const corpusStems = corpusWords.map(stemRussianWord);

            return tokens.every(token => {
                const cleanToken = token.replace(/ё/g, 'е');
                const stem = stemRussianWord(cleanToken);
                if (searchableCorpus.includes(cleanToken)) return true;
                if (stem.length >= 3) {
                    return corpusStems.some(cs => cs.startsWith(stem) || stem.startsWith(cs));
                }
                return false;
            });
        }

        function getFridgeMatchInfo(recipe, rawQuery) {
            const userItems = rawQuery
                .toLowerCase()
                .split(/[,;\n]+|\s+/)
                .map(s => s.trim())
                .filter(s => s.length >= 2);

            if (!userItems.length) {
                return { matchedCount: 0, totalCount: recipe.ingredients.length, matchedNames: [] };
            }

            const userStems = userItems.map(stemRussianWord);
            const matchedNames = [];

            recipe.ingredients.forEach(ing => {
                const ingWords = ing.name.toLowerCase().replace(/ё/g, 'е').split(/[\s,()]+/);
                const ingStems = ingWords.map(stemRussianWord);
                const isMatch = userStems.some((uStem, idx) => {
                    const rawItem = userItems[idx].replace(/ё/g, 'е');
                    if (ing.name.toLowerCase().replace(/ё/g, 'е').includes(rawItem)) return true;
                    return uStem.length >= 3 && ingStems.some(iStem => iStem.startsWith(uStem) || uStem.startsWith(iStem));
                });
                if (isMatch) {
                    matchedNames.push(ing.name);
                }
            });

            return {
                matchedCount: matchedNames.length,
                totalCount: recipe.ingredients.length,
                matchedNames
            };
        }

        // =========================================================================
        // 5. РЕНДЕР МЕНЮ, ЧИПСОВ И СПИСКА РЕЦЕПТОВ
        // =========================================================================
        function renderMoodChips() {
            const container = document.getElementById('mood-chips');
            if (!container) return;

            container.innerHTML = MOOD_CATEGORIES.map(cat => {
                const active = state.selectedMood === cat.id && !state.onlyFavorites;
                return `

                                : 'surface-card text-slate-200'
                        }"

                        ${cat.label}
                    </button>
                `;
            }).join('');
        }

        function renderFridgeChips() {
            const container = document.getElementById('fridge-chips');
            if (!container) return;

            const currentLower = state.searchQuery.toLowerCase();
            container.innerHTML = QUICK_FRIDGE_ITEMS.map(item => {
                const isSelected = currentLower.includes(item.toLowerCase());
                return `
                    <button
                        type="button"
                        onclick="toggleFridgeQuickItem('${item}')"
                        class="chip-item px-2.5 py-1.5 rounded-lg text-[11px] font-semibold border ${
                            isSelected
                                ? 'bg-emerald-500/20 border-emerald-500/60 text-emerald-300'
                                : 'surface-card text-hint'
                        }"
                    >
                        ${isSelected ? '✓ ' : '+ '}${item}
                    </button>
                `;
            }).join('');
        }

        function setSearchMode(mode) {
            haptic('selection');
            state.searchMode = mode;
            const nameBtn = document.getElementById('mode-name-btn');
            const fridgeBtn = document.getElementById('mode-fridge-btn');
            const input = document.getElementById('search-input');
            const fridgeWrapper = document.getElementById('fridge-chips-wrapper');

            if (mode === 'name') {
                nameBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition btn-accent';
                fridgeBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition text-hint';
                input.placeholder = 'Например: шарлотка, запеканка, крылышки...';
                fridgeWrapper.classList.add('hidden');
            } else {
                fridgeBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition btn-accent';
                nameBtn.className = 'py-1.5 px-3 rounded-lg text-xs font-semibold transition text-hint';
                input.placeholder = 'Введи продукты через запятую: курица, картошка...';
                fridgeWrapper.classList.remove('hidden');
                renderFridgeChips();
            }

            renderRecipesFeed();
        }

        function toggleFridgeQuickItem(item) {
            haptic('light');
            const input = document.getElementById('search-input');
            let parts = state.searchQuery
                .split(',')
                .map(s => s.trim())
                .filter(Boolean);

            const existsIdx = parts.findIndex(p => p.toLowerCase() === item.toLowerCase());
            if (existsIdx >= 0) {
                parts.splice(existsIdx, 1);
            } else {
                parts.push(item.toLowerCase());
            }

            state.searchQuery = parts.join(', ');
            input.value = state.searchQuery;
            updateClearButtonVisibility();
            renderFridgeChips();
            renderRecipesFeed();
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
            updateClearButtonVisibility();
            if (state.searchMode === 'fridge') {
                renderFridgeChips();
            }
            renderRecipesFeed();
        }

        function clearSearch() {
            haptic('light');
            state.searchQuery = '';
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            updateClearButtonVisibility();
            if (state.searchMode === 'fridge') renderFridgeChips();
            renderRecipesFeed();

        function updateClearButtonVisibility() {
            const btn = document.getElementById('clear-search-btn');
            if (!btn) return;
            if (state.searchQuery.trim().length > 0) {
                btn.classList.remove('hidden');

                btn.classList.add('hidden');

        function resetAllFilters() {
            haptic('light');
            state.searchQuery = '';
            state.selectedMood = 'all';
            state.onlyFavorites = false;
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            updateClearButtonVisibility();
            updateFavoritesBadge();
            renderMoodChips();
            if (state.searchMode === 'fridge') renderFridgeChips();
            renderRecipesFeed();
        }

        function renderRecipesFeed() {
            const grid = document.getElementById('recipes-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsLabel = document.getElementById('results-label');
            const resetBtn = document.getElementById('reset-filters-btn');
            if (!grid) return;

            let list = [...RECIPES];

            // Фильтр по избранному
            if (state.onlyFavorites) {
                list = list.filter(r => state.favorites.includes(r.id));
            } else if (state.selectedMood !== 'all') {
                list = list.filter(r => r.moods.includes(state.selectedMood));
            }

            // Поиск по слову или по холодильнику
            const q = state.searchQuery.trim();
            const fridgeMatchesMap = {};

            if (q.length > 0) {
                if (state.searchMode === 'name') {
                    list = list.filter(r => matchesTextQuery(r, q));
                } else {
                    list = list
                        .map(r => {
                            const info = getFridgeMatchInfo(r, q);
                            fridgeMatchesMap[r.id] = info;
                            return { recipe: r, info };
                        })
                        .filter(entry => entry.info.matchedCount > 0)
                        .sort((a, b) => b.info.matchedCount - a.info.matchedCount)
                        .map(entry => entry.recipe);
                }
            }

            const hasActiveFilter = q.length > 0 || state.selectedMood !== 'all' || state.onlyFavorites;
            if (resetBtn) {
                resetBtn.classList.toggle('hidden', !hasActiveFilter);
            }

            if (resultsLabel) {
                if (state.onlyFavorites) {
                    resultsLabel.textContent = `Избранные рецепты: ${list.length}`;
                } else if (q.length > 0) {
                    resultsLabel.textContent = `Найдено вариантов: ${list.length}`;
                } else {
                    resultsLabel.textContent = `Проверенные рецепты (${list.length})`;
                }
            }

            if (list.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = list.map(recipe => {
                const isFav = state.favorites.includes(recipe.id);
                const fInfo = fridgeMatchesMap[recipe.id];
                const matchBadge = fInfo
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                        ✓ Есть ${fInfo.matchedCount} из ${fInfo.totalCount}
                       </span>`
                    : '';

                const previewIngredients = recipe.ingredients
                    .slice(0, 4)
                    .map(i => {
                        const isMatched = fInfo?.matchedNames.includes(i.name);
                        return isMatched
                            ? `<span class="text-emerald-300 font-semibold">${i.name}</span>`
                            : `<span>${i.name}</span>`;
                    })
                    .join(' · ');

                return `
                    <article
                        onclick="openRecipeModal('${recipe.id}')"
                        class="surface-card rounded-2xl p-3.5 active:scale-[0.99] transition cursor-pointer relative"
                    >
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-start gap-3 min-w-0">
                                <div class="w-11 h-11 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-2xl shrink-0">
                                    ${recipe.emoji}
                                </div>
                                <div class="min-w-0">
                                    <h2 class="text-sm font-bold leading-snug mb-1">${recipe.title}</h2>
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold bg-orange-500/15 text-orange-400">
                                            🌡 ${recipe.temp}°C · ⏱ ${recipe.time} мин
                                        </span>
                                        <span class="text-[11px] text-hint">${recipe.calories}</span>
                                        ${matchBadge}
                                    </div>
                                </div>
                            </div>

                            <button
                                type="button"
                                onclick="event.stopPropagation(); toggleFavorite('${recipe.id}')"
                                class="w-8 h-8 rounded-lg bg-slate-800/60 flex items-center justify-center text-sm shrink-0 active:scale-90 transition"
                                aria-label="В избранное"
                            >
                                ${isFav ? '❤️' : '🤍'}
                            </button>
                        </div>

                        <p class="text-[11px] text-hint mt-2.5 truncate">
                            ${previewIngredients}${recipe.ingredients.length > 4 ? '…' : ''}
                        </p>
                    </article>
                `;
            }).join('');
        }

        function pickRandomRecipe() {
            haptic('medium');
            const pool = RECIPES;
            const random = pool[Math.floor(Math.random() * pool.length)];
            if (random) {
                showToast(`🎲 Выбрал: ${random.title}`);
                openRecipeModal(random.id);
            }
        }

        // =========================================================================
        // 6. ИЗБРАННОЕ
        // =========================================================================
        function toggleFavorite(recipeId) {
            haptic('light');
            const idx = state.favorites.indexOf(recipeId);
            if (idx >= 0) {
                state.favorites.splice(idx, 1);
                showToast('Убрано из избранного');
            } else {
                state.favorites.push(recipeId);
                showToast('❤️ Сохранено в избранное');
            }
            localStorage.setItem('airfryer_favs_v2', JSON.stringify(state.favorites));
            updateFavoritesBadge();
            renderRecipesFeed();
            if (state.selectedRecipe?.id === recipeId) {
                updateModalFavButton();
            }
        }

        function toggleModalFavorite() {
            if (state.selectedRecipe) {
                toggleFavorite(state.selectedRecipe.id);
            }
        }

        function updateFavoritesBadge() {
            const countEl = document.getElementById('fav-count');
            const iconEl = document.getElementById('fav-heart-icon');
            const btnEl = document.getElementById('fav-filter-btn');
            if (countEl) countEl.textContent = state.favorites.length;
            if (iconEl) iconEl.textContent = state.onlyFavorites ? '❤️' : '🤍';
            if (btnEl) {
                btnEl.classList.toggle('ring-2', state.onlyFavorites);
                btnEl.classList.toggle('ring-orange-500', state.onlyFavorites);
            }

        function updateModalFavButton() {
            const btn = document.getElementById('modal-fav-btn');
            if (!btn || !state.selectedRecipe) return;
            const isFav = state.favorites.includes(state.selectedRecipe.id);
            btn.textContent = isFav ? '❤️' : '🤍';
        }

        // =========================================================================
        // 7. МОДАЛЬНОЕ ОКНО РЕЦЕПТА, ПОРЦИИ И ЗАМЕНА/УДАЛЕНИЕ ИНГРЕДИЕНТОВ
        // =========================================================================
        function formatAmount(rawAmount, ratio) {
            const scaled = rawAmount * ratio;
            if (scaled >= 10) return Math.round(scaled);
            const rounded = Math.round(scaled * 4) / 4;
            return Number.isInteger(rounded) ? rounded : rounded.toString().replace('.', ',');
        }

        function getSubstitutesForIngredient(ing) {
            if (ing.category && INGREDIENT_SUBSTITUTES[ing.category]) {
                return INGREDIENT_SUBSTITUTES[ing.category];
            }
            const lower = ing.name.toLowerCase();
            for (const key of Object.keys(INGREDIENT_SUBSTITUTES)) {
                if (lower.includes(key)) {
                    return INGREDIENT_SUBSTITUTES[key];
                }
            }
            return [];
        }

        function openRecipeModal(recipeId) {
            const recipe = RECIPES.find(r => r.id === recipeId);
            if (!recipe) return;

            haptic('light');
            trackAppEvent('open_recipe', recipe.title);

            state.selectedRecipe = recipe;
            state.servings = recipe.baseServings;
            state.ingMods = {};

            // Сброс и инициализация таймера под время рецепта
            resetTimer(recipe.time * 60, false);

            updateModalFavButton();
            renderModalContent();

            const modal = document.getElementById('recipe-modal');
            modal.classList.remove('hidden');
            modal.scrollTop = 0;

            try {
                tg?.BackButton?.show();
            } catch (e) {}
        }

        function closeRecipeModal() {
            haptic('light');
            stopTimerInterval();
            const modal = document.getElementById('recipe-modal');
            modal.classList.add('hidden');
            state.selectedRecipe = null;

            try {
                tg?.BackButton?.hide();
            } catch (e) {}
        }

        function changeServings(delta) {
            if (!state.selectedRecipe) return;
            const next = state.servings + delta;
            if (next < 1 || next > 8) return;
            haptic('selection');
            state.servings = next;
            renderModalContent();
        }

        function toggleIngDrawer(idx) {
            haptic('light');
            const current = state.ingMods[idx] || {};
            state.ingMods[idx] = {
                ...current,
                openDrawer: !current.openDrawer
            };
            renderModalContent();
        }

        function applyIngReplacement(idx, newName) {
            const cleaned = String(newName || '').trim();
            if (!cleaned) return;
            haptic('success');
            state.ingMods[idx] = {
                removed: false,
                replacement: cleaned,
                openDrawer: false
            };
            showToast(`Заменено на: ${cleaned}`);
            renderModalContent();
        }

        function applyCustomReplacement(idx) {
            const input = document.getElementById(`custom-sub-input-${idx}`);
            if (!input) return;
            if (!input.value.trim()) {
                showToast('Впиши свой продукт для замены');
                return;
            }
            applyIngReplacement(idx, input.value);
        }

        function clearIngReplacement(idx) {
            haptic('light');
            state.ingMods[idx] = {
                removed: false,
                replacement: null,
                openDrawer: false
            };
            renderModalContent();
        }

        function toggleIngRemoved(idx) {
            haptic('medium');
            const current = state.ingMods[idx] || {};
            const nextRemoved = !current.removed;
            state.ingMods[idx] = {
                removed: nextRemoved,
                replacement: nextRemoved ? null : current.replacement,
                openDrawer: false
            };
            showToast(nextRemoved ? 'Ингредиент убран из рецепта' : 'Ингредиент возвращён');
            renderModalContent();
        }

        function buildAirFryerAdaptationNotice(recipe) {
            const warnings = [];
            recipe.ingredients.forEach((ing, idx) => {
                const mod = state.ingMods[idx];
                if (!mod?.removed) return;
                const lower = ing.name.toLowerCase();
                if (lower.includes('масло')) {
                    warnings.push('Вы убрали масло — используйте пергамент для аэрогриля или слегка сбрызните чашу водой, чтобы продукты не прилипли.');
                } else if (lower.includes('яйц')) {
                    warnings.push('Вы убрали яйца — масса может стать рассыпчатой, плотнее утрамбуйте её в форму.');
                } else if (lower.includes('разрыхлитель')) {
                    warnings.push('Без разрыхлителя выпечка поднимется меньше — проверьте готовность зубочисткой на 3 минуты раньше.');
                }
            });
            return warnings;
        }

        function highlightStepsWithMods(steps, recipe) {
            const activeSubs = [];
            recipe.ingredients.forEach((ing, idx) => {
                const mod = state.ingMods[idx];
                if (mod?.replacement) {
                    const baseWord = ing.name.split('(')[0].trim();
                    const stem = stemRussianWord(baseWord.split(' ')[0]);
                    activeSubs.push({
                        original: baseWord,
                        stem,
                        replacement: mod.replacement
                    });
                }
            });

            return steps.map(step => {
                let text = step;
                activeSubs.forEach(sub => {
                    if (sub.stem.length >= 3) {
                        const regex = new RegExp(`(${sub.stem}[а-яё]*)`, 'gi');
                        text = text.replace(
                            regex,
                            `<span class="underline decoration-emerald-400 font-semibold text-emerald-300">$1 → ${sub.replacement}</span>`
                        );
                    }
                });
                return text;
            });
        }

        function renderModalContent() {
            const recipe = state.selectedRecipe;
            const body = document.getElementById('modal-body');
            if (!recipe || !body) return;

            const ratio = state.servings / recipe.baseServings;
            const warnings = buildAirFryerAdaptationNotice(recipe);
            const adaptedSteps = highlightStepsWithMods(recipe.steps, recipe);

            const ingredientsHtml = recipe.ingredients.map((ing, idx) => {
                const mod = state.ingMods[idx] || {};
                const isRemoved = Boolean(mod.removed);
                const replacement = mod.replacement;
                const isOpen = Boolean(mod.openDrawer);
                const amountStr = `${formatAmount(ing.amount, ratio)} ${ing.unit}`;
                const presetSubs = getSubstitutesForIngredient(ing);

                const presetsHtml = presetSubs.length > 0
                    ? presetSubs.map(s => `
                        <button
                            type="button"
                            onclick="applyIngReplacement(${idx}, '${s.name.replace(/'/g, "\\'")}')"
                            class="w-full text-left p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600/40 transition"
                        >
                            <div class="text-xs font-semibold text-emerald-300">⇄ ${s.name}</div>
                            <div class="text-[11px] text-hint">${s.tip}</div>
                        </button>
                    `).join('')
                    : `<p class="text-[11px] text-hint">Впиши ниже любой продукт, который есть дома:</p>`;

                return `
                    <div class="py-2.5 border-b border-slate-700/30 last:border-b-0">
                        <div class="flex items-center justify-between gap-2">
                            <div class="min-w-0 flex-1 ${isRemoved ? 'opacity-45 line-through' : ''}">
                                ${
                                    replacement
                                        ? `<div class="text-[11px] text-hint line-through">${ing.name}</div>
                                           <div class="text-xs font-bold text-emerald-300">⇄ ${replacement}</div>`
                                        : `<div class="text-xs font-semibold">${ing.name}</div>`
                                }
                                <div class="text-[11px] text-hint mt-0.5">${amountStr}</div>
                            </div>

                            <div class="flex items-center gap-1.5 shrink-0">
                                ${
                                    !isRemoved
                                        ? `<button
                                            type="button"
                                            onclick="toggleIngDrawer(${idx})"
                                            class="px-2 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-800/90 border border-slate-600/40 text-slate-200 active:scale-95 transition"
                                            title="Заменить ингредиент"
                                           >
                                            ⇄ Заменить
                                           </button>`
                                        : ''
                                }
                                <button
                                    type="button"
                                    onclick="toggleIngRemoved(${idx})"
                                    class="px-2 py-1.5 rounded-lg text-[11px] font-semibold border active:scale-95 transition ${
                                        isRemoved
                                            ? 'bg-amber-500/20 border-amber-500/40 text-amber-300'
                                            : 'bg-slate-800/90 border-slate-600/40 text-hint'
                                    }"
                                    title="${isRemoved ? 'Вернуть' : 'Убрать ингредиент'}"
                                >
                                    ${isRemoved ? '↩ Вернуть' : '✕'}
                                </button>
                            </div>
                        </div>

                        <!-- Панель выбора замены -->
                        ${
                            isOpen && !isRemoved
                                ? `<div class="mt-2.5 p-2.5 rounded-xl bg-slate-900/80 border border-slate-700/60 space-y-2">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[11px] font-bold text-slate-300">Чем заменить «${ing.name}»?</span>
                                        ${
                                            replacement
                                                ? `<button type="button" onclick="clearIngReplacement(${idx})" class="text-[11px] text-orange-400 font-semibold">Вернуть оригинал</button>`
                                                : ''
                                        }
                                    </div>
                                    <div class="space-y-1.5">${presetsHtml}</div>
                                    <div class="flex gap-1.5 pt-1">
                                        <input
                                            id="custom-sub-input-${idx}"
                                            type="text"
                                            placeholder="Свой вариант из холодильника..."
                                            class="flex-1 bg-slate-800 border border-slate-600/50 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-orange-500"
                                            style="color: var(--text-color);"
                                        >
                                        <button
                                            type="button"
                                            onclick="applyCustomReplacement(${idx})"
                                            class="btn-accent px-3 py-1.5 rounded-lg text-xs font-bold shrink-0"
                                        >
                                            ОК
                                        </button>
                                    </div>
                                   </div>`
                                : ''
                        }
                    </div>
                `;
            }).join('');

            const warningsHtml = warnings.length > 0
                ? `<div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/40 text-xs text-amber-200 space-y-1">
                    <div class="font-bold">⚠️ Подсказка для аэрогриля:</div>
                    ${warnings.map(w => `<p class="text-[11px] leading-relaxed">${w}</p>`).join('')}
                   </div>`
                : '';

            body.innerHTML = `
                <!-- Заголовок и параметры -->
                <div class="surface-card rounded-2xl p-4">
                    <div class="flex items-start gap-3 mb-3">
                        <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700/60 flex items-center justify-center text-3xl shrink-0">
                            ${recipe.emoji}
                        </div>
                        <div>
                            <h2 class="text-base font-extrabold leading-snug">${recipe.title}</h2>
                            <p class="text-xs text-hint mt-0.5">${recipe.calories} на 100 г</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="p-2.5 rounded-xl bg-orange-500/15 border border-orange-500/30 text-center">
                            <div class="text-[11px] text-orange-300/80">Температура</div>
                            <div class="text-base font-extrabold text-orange-400">🌡 ${recipe.temp}°C</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-sky-500/15 border border-sky-500/30 text-center">

                            <div class="text-base font-extrabold text-sky-400">⏱ ${recipe.time} мин</div>
                        </div>
                    </div>
                </div>

                <!-- Встроенный таймер с сигналом встряхивания -->
                <div class="surface-card rounded-2xl p-4">
                    <div class="flex items-center justify-between gap-3">
                        <div>
                            <div class="text-xs font-bold flex items-center gap-1.5">
                                <span>⏲ Таймер аэрогриля</span>
                            </div>
                            <div id="timer-status-text" class="text-[11px] text-hint mt-0.5">
                                Напомнит встряхнуть корзину на половине времени
                            </div>
                        </div>

                        <div id="timer-display" class="text-2xl font-extrabold font-mono tracking-tight text-orange-400">
                            ${formatTimerDisplay(state.timer.remainingSeconds)}

                    </div>

                    <div id="timer-shake-banner" class="hidden mt-2.5 p-2.5 rounded-xl bg-amber-500/20 border border-amber-400/50 text-xs font-bold text-amber-200 text-center shake-alert-pulse">
                        🔔 Половина времени! Встряхни корзину или переверни блюдо
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <button id="timer-toggle-btn" type="button" onclick="toggleTimer()" class="btn-accent py-2.5 px-3 rounded-xl text-xs font-bold shadow active:scale-95 transition">
                            ▶ Запустить таймер
                        </button>
                        <button type="button" onclick="resetTimer()" class="py-2.5 px-3 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-600/40 active:scale-95 transition">
                            ↺ Сбросить
                        </button>
                    </div>
                </div>

                ${warningsHtml}

                <!-- Ингредиенты + калькулятор порций + замены -->
                <div class="surface-card rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <h3 class="text-sm font-bold">Ингредиенты</h3>
                            <p class="text-[11px] text-hint">Можно заменить или убрать любой продукт</p>
                        </div>

                        <!-- Калькулятор порций -->
                        <div class="flex items-center gap-2 bg-slate-800/90 border border-slate-700/60 rounded-xl p-1">
                            <button type="button" onclick="changeServings(-1)" class="w-7 h-7 rounded-lg bg-slate-700/70 font-bold text-sm flex items-center justify-center active:scale-90">−</button>
                            <span class="text-xs font-bold px-1">${state.servings} порц.</span>
                            <button type="button" onclick="changeServings(1)" class="w-7 h-7 rounded-lg bg-slate-700/70 font-bold text-sm flex items-center justify-center active:scale-90">+</button>
                        </div>
                    </div>

                    <div>${ingredientsHtml}</div>
                </div>

                <!-- Пошаговое приготовление -->
                <div class="surface-card rounded-2xl p-4">
                    <h3 class="text-sm font-bold mb-3">Как готовить</h3>
                    <ol class="space-y-3">
                        ${adaptedSteps.map((step, i) => `
                            <li class="flex items-start gap-2.5 text-xs leading-relaxed">
                                <span class="w-5 h-5 rounded-full btn-accent text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5">
                                    ${i + 1}
                                </span>
                                <span>${step}</span>
                            </li>
                        `).join('')}
                    </ol>
                </div>
            `;
        }

        // =========================================================================
        // 8. ТАЙМЕР СО ЗВУКОВЫМ СИГНАЛОМ И ВИБРАЦИЕЙ
        // =========================================================================
        function formatTimerDisplay(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playBeepTone(repeat = 2) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                for (let i = 0; i < repeat; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = i % 2 === 0 ? 880 : 1046;
                    gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.28);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.28 + 0.24);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.28);
                    osc.stop(ctx.currentTime + i * 0.28 + 0.25);
                }
            } catch (e) {}
        }

        function stopTimerInterval() {
            if (state.timer.intervalId) {
                clearInterval(state.timer.intervalId);
                state.timer.intervalId = null;
            }
            state.timer.isRunning = false;
        }

        function resetTimer(customSeconds = null, triggerHaptic = true) {
            if (triggerHaptic) haptic('light');
            stopTimerInterval();
            const baseSec = customSeconds !== null
                ? customSeconds
                : (state.selectedRecipe ? state.selectedRecipe.time * 60 : 600);

            state.timer.totalSeconds = baseSec;
            state.timer.remainingSeconds = baseSec;
            state.timer.halfwayNotified = false;

            const disp = document.getElementById('timer-display');
            const btn = document.getElementById('timer-toggle-btn');
            const banner = document.getElementById('timer-shake-banner');
            const statusText = document.getElementById('timer-status-text');

            if (disp) disp.textContent = formatTimerDisplay(baseSec);
            if (btn) btn.textContent = '▶ Запустить таймер';
            if (banner) banner.classList.add('hidden');
            if (statusText) statusText.textContent = 'Напомнит встряхнуть корзину на половине времени';
        }

        function toggleTimer() {
            haptic('medium');
            const btn = document.getElementById('timer-toggle-btn');

            if (state.timer.isRunning) {
                stopTimerInterval();
                if (btn) btn.textContent = '▶ Продолжить';
                return;
            }

            if (state.timer.remainingSeconds <= 0) {
                resetTimer(null, false);
            }

            state.timer.isRunning = true;
            if (btn) btn.textContent = '⏸ Пауза';

            const halfwayPoint = Math.floor(state.timer.totalSeconds / 2);

            state.timer.intervalId = setInterval(() => {
                state.timer.remainingSeconds -= 1;

                const disp = document.getElementById('timer-display');
                if (disp) disp.textContent = formatTimerDisplay(Math.max(0, state.timer.remainingSeconds));

                // Сигнал ровно на экваторе готовки (встряхнуть корзину)
                if (!state.timer.halfwayNotified && state.timer.remainingSeconds <= halfwayPoint && state.timer.remainingSeconds > 0) {
                    state.timer.halfwayNotified = true;
                    haptic('warning');
                    playBeepTone(2);
                    const banner = document.getElementById('timer-shake-banner');
                    if (banner) banner.classList.remove('hidden');
                }

                // Завершение таймера
                if (state.timer.remainingSeconds <= 0) {
                    stopTimerInterval();
                    haptic('success');
                    playBeepTone(4);
                    const btnEl = document.getElementById('timer-toggle-btn');
                    const statusEl = document.getElementById('timer-status-text');
                    const bannerEl = document.getElementById('timer-shake-banner');
                    if (btnEl) btnEl.textContent = '▶ Запустить снова';
                    if (statusEl) statusEl.textContent = '✅ Время вышло! Блюдо готово';
                    if (bannerEl) {
                        bannerEl.textContent = '🎉 Готово! Доставай блюдо из аэрогриля';
                        bannerEl.classList.remove('hidden');
                    }
                }
            }, 1000);
        }

        // =========================================================================
        // 9. ОТПРАВКА СПИСКА ПОКУПОК В TELEGRAM
        // =========================================================================
        function shareShoppingList() {
            const recipe = state.selectedRecipe;
            if (!recipe) return;

            haptic('light');
            const ratio = state.servings / recipe.baseServings;

            const lines = [];
            recipe.ingredients.forEach((ing, idx) => {
                const mod = state.ingMods[idx] || {};
                if (mod.removed) return;
                const finalName = mod.replacement || ing.name;
                const amountStr = `${formatAmount(ing.amount, ratio)} ${ing.unit}`;
                lines.push(`• ${finalName} — ${amountStr}`);
            });

            const messageText = [
                `🔥 ${recipe.title}`,
                `🌡 ${recipe.temp}°C · ⏱ ${recipe.time} мин (${state.servings} порц.)`,
                ``,
                `🛒 Список продуктов:`,
                ...lines
            ].join('\n');

            // Копируем в буфер обмена надёжным способом
            try {
                const ta = document.createElement('textarea');
                ta.value = messageText;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (e) {}

            // Открываем нативное окно пересылки в Telegram (в Избранное или любой чат)
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(messageText)}`;
            try {
                if (tg?.openTelegramLink) {
                    tg.openTelegramLink(shareUrl);
                } else {
                    window.open(shareUrl, '_blank');
                }
            } catch (e) {}

            showToast('📋 Список скопирован и готов к отправке');
        }

        // =========================================================================
        // 10. ГОРИЗОНТАЛЬНЫЙ СКРОЛЛ КОЛЁСИКОМ МЫШИ И ПЕРЕТАСКИВАНИЕМ
        // =========================================================================
        function enableHorizontalScrollEnhancements(el) {
            if (!el) return;

            // Прокрутка колёсиком мыши на десктопе
            el.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                }
            }, { passive: false });

            // Перетаскивание мышью (drag-to-scroll)
            let isDown = false;
            let startX = 0;
            let scrollLeft = 0;

            el.addEventListener('mousedown', (e) => {
                isDown = true;
                el.classList.add('grabbing');
                startX = e.pageX - el.offsetLeft;
                scrollLeft = el.scrollLeft;
            });

            el.addEventListener('mouseleave', () => {
                isDown = false;
                el.classList.remove('grabbing');
            });

            el.addEventListener('mouseup', () => {
                isDown = false;
                el.classList.remove('grabbing');
            });

            el.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - el.offsetLeft;
                const walk = (x - startX) * 1.5;
                el.scrollLeft = scrollLeft - walk;
            });
        }

        // =========================================================================
        // 11. ТИХАЯ ОТПРАВКА АНАЛИТИКИ ПОСЕТИТЕЛЕЙ В GOOGLE ТАБЛИЦУ
        // =========================================================================
        function trackAppEvent(eventName = 'app_open', details = '') {
            try {
                if (!ANALYTICS_WEBHOOK_URL || !ANALYTICS_WEBHOOK_URL.startsWith('http')) return;

                if (eventName === 'app_open') {
                    if (sessionStorage.getItem('airfryer_tma_logged')) return;
                    sessionStorage.setItem('airfryer_tma_logged', '1');
                }

                const user = tg?.initDataUnsafe?.user || {};
                const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Гость (браузер)';

                const payload = {
                    timestamp: new Date().toLocaleString('ru-RU'),
                    userId: user.id ? String(user.id) : 'browser_guest',
                    fullName: fullName,
                    username: user.username ? `@${user.username}` : '—',
                    platform: tg?.platform || 'web',
                    event: eventName,
                    details: String(details || '')
                };

                fetch(ANALYTICS_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    keepalive: true,
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
            } catch (e) {}
        }

        // =========================================================================
        // 12. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            initTelegram();
            trackAppEvent('app_open');
            renderMoodChips();
            updateFavoritesBadge();
            renderRecipesFeed();

            enableHorizontalScrollEnhancements(document.getElementById('mood-chips'));
            enableHorizontalScrollEnhancements(document.getElementById('fridge-chips'));
        });
    </script>
